[package]
name = "osmia"
version = "0.1.0"
edition = "2024"

[dependencies]
bytemuck = "1.25.2"
calloop = "0.14.5"
chrono = "0.4.45"
egui = { version = "0.37.0", features = ["default_fonts"] }
egui-wgpu = "0.37.0"
env_logger = "0.11.11"
futures-lite = "2.6.1"
jpeg-decoder = "0.3.2"
libc = "0.2.191"
log = "0.4.35"
png = "0.18.1"
pollster = "1.0.1"
raw-window-handle = "0.6.2"
resvg = { version = "0.49.0", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
smithay-client-toolkit = { version = "0.21.1", features = ["system"] }
toml = "1.1.8"
wayland-backend = { version = "0.3.17", features = ["client_system"] }
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", features = ["client", "staging", "unstable"] }
wayland-protocols-wlr = "0.3.12"
wgpu = "30.0.1"
zbus = "6.2.1"

[profile.release]
strip = true
lto = "thin"
codegen-units = 4
